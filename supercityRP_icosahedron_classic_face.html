<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>supercity RP</title>
<style>
:root{--panel:#d4d0c8;box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-touch-callout:none;background:#7db9e8;font-family:Tahoma,Verdana,Arial,sans-serif;user-select:none}
canvas{display:block}
#logo{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:10px;font:bold 22px "Arial Black",Arial,sans-serif;color:#fff;background:#2e7d32;padding:3px 10px;border:2px solid #fff;letter-spacing:.5px;text-shadow:1px 1px 0 #0006}
#logo small{font:normal 11px Tahoma,sans-serif;margin-left:6px}
#help{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:10px;background:var(--panel);border:2px outset #fff;padding:6px 8px;font-size:12px;line-height:1.5;color:#000}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:var(--panel);padding:5px;border:2px outset #fff;flex-wrap:wrap;justify-content:center;max-width:96vw;z-index:8}
#bar button{height:30px;border:2px outset #fff;background:var(--panel);font:12px Tahoma,sans-serif;cursor:pointer;padding:0 8px;white-space:nowrap;color:#000}
#bar button:active{border-style:inset}
#panel{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(430px,94vw);max-height:46vh;overflow:auto;background:var(--panel);border:2px outset #fff;padding:6px;z-index:8;color:#000}
.ph{font:bold 13px Tahoma,sans-serif;margin:0 0 6px;text-align:center}
.pg{display:grid;gap:4px}
.pg button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border:2px outset #fff;background:#fff;cursor:pointer;font:11px Tahoma,sans-serif;color:#000}
.pg button span{font-size:22px;line-height:1.1}
.pg button i{font-style:normal;text-align:center}
.pg button.on{border-style:inset;background:#ffd800}
#joy,#jump{display:none;position:fixed;touch-action:none;bottom:calc(28px + env(safe-area-inset-bottom,0px));border-radius:50%;background:#0003;border:2px solid #fff9;color:#fff;font:bold 14px Tahoma,sans-serif;align-items:center;justify-content:center}
#joy{left:calc(24px + env(safe-area-inset-left,0px));width:120px;height:120px}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fffc;pointer-events:none}
#jump{right:calc(24px + env(safe-area-inset-right,0px));width:84px;height:84px}
@media (pointer:coarse){#joy{display:block}#jump{display:flex}#help{display:none}
#bar{top:calc(50px + env(safe-area-inset-top,0px));bottom:auto;left:8px;transform:none;max-width:calc(100vw - 16px);justify-content:flex-start}
#panel{top:calc(140px + env(safe-area-inset-top,0px));bottom:auto}
#chatlog{bottom:calc(170px + env(safe-area-inset-bottom,0px)) !important}}
#start{position:fixed;inset:0;z-index:10;background:linear-gradient(#5aa5e0,#a9d6f5);display:flex;align-items:center;justify-content:center;text-align:center}
#start h1{margin:0;font:bold 54px "Arial Black",Arial,sans-serif;color:#fff;background:#2e7d32;padding:8px 24px;border:3px solid #fff;display:inline-block;text-shadow:2px 2px 0 #0006}
#start p{margin:10px 0 22px;color:#fff;font:bold 16px Tahoma,sans-serif;text-shadow:1px 1px 0 #0006}
#start button{font:bold 22px Tahoma,sans-serif;padding:8px 40px;border:3px outset #fff;background:#d4d0c8;cursor:pointer}
#chatlog{position:fixed;left:10px;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(360px,60vw);max-height:34vh;overflow:hidden;display:flex;flex-direction:column-reverse;gap:2px;pointer-events:none;font:12px Tahoma,sans-serif}
#chatlog div{background:#000a;color:#fff;padding:3px 7px;border-radius:3px;max-width:100%;word-break:break-word}
#chatlog div b{color:#ffd800}
#chatbox{display:none;position:fixed;left:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(360px,60vw);z-index:9;background:var(--panel);border:2px outset #fff;padding:4px}
#chathead{font:bold 12px Tahoma,sans-serif;margin:0 0 4px;color:#000}
#chathead small{font:normal 10px Tahoma,sans-serif;color:#444;margin-left:4px}
#chatbox input{width:100%;box-sizing:border-box;font:13px Tahoma,sans-serif;padding:6px 8px;border:2px inset #fff}
#chatrow{display:flex;gap:4px}
#chatbox button{font:bold 12px Tahoma,sans-serif;padding:0 12px;border:2px outset #fff;background:#d4d0c8;cursor:pointer}
#chatbtn{display:none;position:fixed;touch-action:none;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(128px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:8px;background:#0006;border:2px solid #fff9;color:#fff;font:20px Tahoma,sans-serif;align-items:center;justify-content:center;cursor:pointer;z-index:9}
@media (pointer:coarse){#chatbtn{display:flex}}
#netstat{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:10px;background:#0007;color:#ffd800;font:11px Tahoma,sans-serif;padding:2px 8px;border-radius:4px;display:none}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:#000b;color:#fff;font:bold 14px Tahoma,sans-serif;padding:6px 14px;border-radius:6px;display:none;z-index:9;pointer-events:none;text-align:center}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
</style>
</head>
<body>
<div id="logo">supercity RP<small></small></div>
<div id="help"><b>WASD</b> move · <b>Space</b> jump · <b>Right-drag</b> or Q/Z camera · <b>Wheel</b> zoom<br><b>E</b> get in/out of car · <b>F</b> use item · <b>R</b> respawn · <b>Enter</b> chat</div>
<div id="bar"></div>
<div id="panel"></div>
<div id="toast"></div>
<div id="flash"></div>
<div id="chatlog"></div>
<div id="chatbox"><div id="chathead">💬 Chat Room<small>private · only you can see it</small></div><div id="chatrow"><input id="cin" maxlength="150" placeholder="Type a message..."><button id="csend">Send</button></div></div>
<div id="netstat">Connecting…</div>
<div id="chatbtn">💬</div>
<div id="joy"><div id="knob"></div></div><div id="jump">Jump</div>
<div id="start"><div><h1>supercity RP</h1><p>Roleplay town</p><button id="go">Play</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const TOUCH=matchMedia('(pointer:coarse)').matches;
const $=id=>document.getElementById(id);
let myName='Guest';const JOIN=Date.now(),MAXP=24;
$('go').onclick=()=>{myName='Player'+String(Math.floor(Math.random()*94356)+1).padStart(5,'0');$('start').style.display='none';audioInit();netStart();toast('Welcome to supercity RP! 🚗 Vehicles and 🎒 Items are in the bar');};

// ===== Renderer / scene =====
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0xbdc8e2);S.fog=new THREE.Fog(0xbdc8e2,140,320);
const skyMat=new THREE.MeshBasicMaterial({map:new THREE.TextureLoader().load('__SKY__'),side:THREE.BackSide,fog:false,depthWrite:false});
const sky=new THREE.Mesh(new THREE.SphereGeometry(400,32,20),skyMat);sky.rotation.y=Math.PI/2;S.add(sky);
const C=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,600);
const hemi=new THREE.HemisphereLight(0xffffff,0x667766,0.8);S.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.65);sun.castShadow=true;sun.shadow.mapSize.set(TOUCH?1024:2048,TOUCH?1024:2048);
Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:1,far:220});S.add(sun,sun.target);

// ===== Helpers =====
const MC={};const mat=c=>MC[c]||(MC[c]=new THREE.MeshLambertMaterial({color:c}));
function canvasTex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return new THREE.CanvasTexture(c);}
const COL=[];
function box(x,y0,z,w,h,d,color,o){o=o||{};
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),o.mat||mat(color));
  m.position.set(x,y0+h/2,z);
  if(o.cast!==false&&Math.max(w,d)>2.5&&h>1.5)m.castShadow=true;
  m.receiveShadow=true;S.add(m);
  if(o.col!==false)COL.push({lo:[x-w/2,y0,z-d/2],hi:[x+w/2,y0+h,z+d/2],tramp:!!o.tramp});
  return m;}
const deco=(x,y0,z,w,h,d,color,o)=>box(x,y0,z,w,h,d,color,Object.assign({col:false,cast:false},o||{}));
function flat(x,z,w,d,color,y,o){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),(o&&o.mat)||mat(color));m.rotation.x=-Math.PI/2;m.position.set(x,y||0.04,z);m.receiveShadow=true;S.add(m);return m;}
const hash=(a,b)=>Math.abs(Math.sin(a*12.9898+b*78.233)*43758.5453)%1;

// ===== Ground, roads =====
const gt=canvasTex(64,64,(x)=>{x.fillStyle='#62a244';x.fillRect(0,0,64,64);x.fillStyle='#6cb04c';x.beginPath();x.arc(32,32,14,0,7);x.fill();x.strokeStyle='#4f8a36';x.lineWidth=2;x.strokeRect(0,0,64,64);});
gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(128,128);gt.magFilter=THREE.NearestFilter;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(256,256),new THREE.MeshLambertMaterial({map:gt}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);
flat(0,0,1400,1400,'#4f8a3a',-0.05);
const HR=[-62,0,62],VR=[-62,0,62],RW=12,EDGE=[-124,-68,-56,-6,6,56,68,124];
const roadBase=canvasTex(128,64,(x,w,h)=>{x.fillStyle='#3b3b40';x.fillRect(0,0,w,h);x.fillStyle='#e9e9e9';x.fillRect(0,2,w,2);x.fillRect(0,h-4,w,2);x.fillStyle='#e8c53a';x.fillRect(0,29,64,2);x.fillRect(0,33,64,2);});
function roadPlane(cx,cz,len,horiz){const t=roadBase.clone();t.needsUpdate=true;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(len/16,1);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(len,RW),new THREE.MeshLambertMaterial({map:t}));
  m.rotation.set(-Math.PI/2,0,horiz?0:Math.PI/2);m.position.set(cx,0.03,cz);m.receiveShadow=true;S.add(m);}
for(const c of HR)for(let i=0;i<EDGE.length;i+=2)roadPlane((EDGE[i]+EDGE[i+1])/2,c,EDGE[i+1]-EDGE[i],true);
for(const c of VR)for(let i=0;i<EDGE.length;i+=2)roadPlane(c,(EDGE[i]+EDGE[i+1])/2,EDGE[i+1]-EDGE[i],false);
const zebra=canvasTex(64,16,(x)=>{x.fillStyle='#3b3b40';x.fillRect(0,0,64,16);x.fillStyle='#f0f0f0';for(let i=0;i<8;i++)x.fillRect(i*8+2,0,4,16);});
const lampMat=new THREE.MeshBasicMaterial({color:0xb8b08a});
function lamp(x,z){deco(x,0,z,0.5,9,0.5,'#555555');const m=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.6,1.6),lampMat);m.position.set(x,9.3,z);S.add(m);}
for(const vx of VR)for(const hz of HR){
  flat(vx,hz,RW,RW,'#3b3b40',0.03);
  const zv=zebra.clone();zv.needsUpdate=true;const zh=zebra.clone();zh.needsUpdate=true;zh.center.set(.5,.5);zh.rotation=Math.PI/2;
  const mv=new THREE.MeshLambertMaterial({map:zv}),mh=new THREE.MeshLambertMaterial({map:zh});
  flat(vx,hz-8,RW,3,0,0.04,{mat:mv});flat(vx,hz+8,RW,3,0,0.04,{mat:mv});
  flat(vx-8,hz,3,RW,0,0.04,{mat:mh});flat(vx+8,hz,3,RW,0,0.04,{mat:mh});
  for(const sx of[-1,1])for(const sz of[-1,1])lamp(vx+sx*7.5,hz+sz*7.5);
}
// invisible boundary walls
const invis=new THREE.MeshBasicMaterial({visible:false});
for(const [cx,cz,w,d] of [[0,-124,260,6],[0,124,260,6],[124,0,6,260],[-124,0,6,260]])box(cx,-150,cz,w,600,d,null,{mat:invis,cast:false});

// ===== Buildings =====
const PLACES=[],HOUSES=[],FAC=[];
function winTex(cols,rows,len,h,door,gap,lit){
  const cw=cols*24,ch=rows*24;
  return canvasTex(cw,ch,(x)=>{x.clearRect(0,0,cw,ch);
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const u=(c+.5)/cols*len-len/2,bottom=1+(rows-1-r)/rows*(h-2);
      if(door&&Math.abs(u)<gap/2+1.3&&bottom<7.4)continue;
      x.fillStyle=lit?(hash(c,r+len)>.25?'#ffd980':'#2a3150'):'#86b9dc';
      x.fillRect(c*24+4,r*24+4,16,16);x.strokeStyle=lit?'#6a5a3a':'#ffffff';x.lineWidth=2;x.strokeRect(c*24+4,r*24+4,16,16);}});}
function facade(cx,cz,w,d,h,door,rows,gap,Y){
  for(const k of['n','s','w','e']){
    const alongX=k==='n'||k==='s',len=alongX?w:d,cols=Math.max(1,Math.floor(len/5));
    const day=winTex(cols,rows,len,h,k===door,gap,false),night=winTex(cols,rows,len,h,k===door,gap,true);
    const mt=new THREE.MeshBasicMaterial({map:day,transparent:true,depthWrite:false});FAC.push({mat:mt,day,night});
    const m=new THREE.Mesh(new THREE.PlaneGeometry(len-1.2,h-2),mt);m.position.y=Y+h/2;
    if(k==='n'){m.position.set(cx,Y+h/2,cz-d/2-0.56);m.rotation.y=Math.PI;}
    else if(k==='s'){m.position.set(cx,Y+h/2,cz+d/2+0.56);}
    else if(k==='w'){m.position.set(cx-w/2-0.56,Y+h/2,cz);m.rotation.y=-Math.PI/2;}
    else{m.position.set(cx+w/2+0.56,Y+h/2,cz);m.rotation.y=Math.PI/2;}
    S.add(m);}}
function signAt(text,cx,cz,w,d,door,y,sw,sh,bg,fg){
  const c=document.createElement('canvas');c.width=512;c.height=Math.max(64,Math.round(512*sh/sw));const x=c.getContext('2d');
  x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);x.strokeStyle=fg;x.lineWidth=6;x.strokeRect(5,5,c.width-10,c.height-10);
  let fs=c.height*0.6;x.font='bold '+fs+'px Arial,sans-serif';while(x.measureText(text).width>c.width-30&&fs>10){fs-=4;x.font='bold '+fs+'px Arial,sans-serif';}
  x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';x.fillText(text,c.width/2,c.height/2+2);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(sw,sh),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c)}));
  if(door==='n'){m.position.set(cx,y,cz-d/2-0.7);m.rotation.y=Math.PI;}
  else if(door==='s'){m.position.set(cx,y,cz+d/2+0.7);}
  else if(door==='w'){m.position.set(cx-w/2-0.7,y,cz);m.rotation.y=-Math.PI/2;}
  else{m.position.set(cx+w/2+0.7,y,cz);m.rotation.y=Math.PI/2;}
  S.add(m);}
function building(cx,cz,w,d,h,color,door,roof,o){o=o||{};
  const t=1,g=o.gap||6,dh=7,hw=w/2,hd=d/2,Y=o.y0||0;
  const sides=[['n',cx,cz-hd,w,true],['s',cx,cz+hd,w,true],['w',cx-hw,cz,d-t,false],['e',cx+hw,cz,d-t,false]];
  for(const [k,x,z,len,ax] of sides){
    if(k!==door){ax?box(x,Y,z,len,h,t,color):box(x,Y,z,t,h,len,color);continue;}
    const seg=(len-g)/2,off=(g+seg)/2;
    if(ax){box(x-off,Y,z,seg,h,t,color);box(x+off,Y,z,seg,h,t,color);box(x,Y+dh,z,g,h-dh,t,color);}
    else{box(x,Y,z-off,t,h,seg,color);box(x,Y,z+off,t,h,seg,color);box(x,Y+dh,z,t,h-dh,g,color);}}
  box(cx,Y+h,cz,w+1.6,1,d+1.6,roof);
  deco(cx,Y+0.03,cz,w-2,0.06,d-2,o.floor||'#cdbb9c');
  facade(cx,cz,w,d,h,door,o.floors||Math.max(1,Math.round(h/5)),g,Y);
  if(o.sign){const sh=Math.min(2.4,(h-dh)*0.8);signAt(o.sign,cx,cz,w,d,door,o.signY||(Y+(dh+h)/2),Math.min(o.signW||13,len2(door,w,d)-g),sh,o.signBg||'#1a3fa8',o.signFg||'#ffffff');}
  const fr={n:[cx,cz-hd-4],s:[cx,cz+hd+4],w:[cx-hw-4,cz],e:[cx+hw+4,cz]}[door];
  return{front:fr,y:Y};}
const len2=(door,w,d)=>(door==='n'||door==='s')?w:d;
function place(name,ico,b,y){PLACES.push({n:name,ico,x:b.front[0],z:b.front[1],y:(y||0)});}
const desk=(x,z,w,d,c)=>box(x,0,z,w,1.3,d,c||'#8a6b4a');
const tree=(x,z)=>{box(x,0,z,1.6,6,1.6,'#6b4423');box(x,6,z,7,5,7,['#2f7a2f','#3b8a3b','#2a6e35'][Math.floor(hash(x,z)*3)]);};
const bench=(x,z,horiz)=>{if(horiz){box(x,0.9,z,4,0.5,1.3,'#8a6b4a');box(x,1.4,z-0.6,4,1.2,0.3,'#8a6b4a',{col:false});}else{box(x,0.9,z,1.3,0.5,4,'#8a6b4a');box(x-0.6,1.4,z,0.3,1.2,4,'#8a6b4a',{col:false});}};

// ===== Vehicles =====
const VT=[
 {id:'sedan',n:'Sedan',ico:'🚗',color:'#c4281c',len:6,wid:3.4,bh:1.5,speed:46},
 {id:'sport',n:'Sports Car',ico:'🏎️',color:'#1a5fb4',len:6,wid:3.2,bh:1.1,cabL:.4,speed:62,spoiler:1},
 {id:'taxi',n:'Taxi',ico:'🚕',color:'#f5cd30',len:6,wid:3.4,bh:1.5,speed:44,taxi:1},
 {id:'police',n:'Police Car',ico:'🚓',color:'#1b1b22',len:6.4,wid:3.5,bh:1.5,speed:54,siren:1,stripe:'#f2f2f2'},
 {id:'pickup',n:'Pickup',ico:'🛻',color:'#3b7d3b',len:7.4,wid:3.6,bh:1.2,speed:44,bed:1},
 {id:'bus',n:'School Bus',ico:'🚌',color:'#f2b800',len:11,wid:4,bh:3.6,speed:34,noCab:1,band:1,axles:3},
 {id:'fire',n:'Fire Truck',ico:'🚒',color:'#c4281c',len:10,wid:4,bh:2.4,speed:38,ladder:1,axles:3,cabL:.28,cabZ:3.2},
 {id:'ambulance',n:'Ambulance',ico:'🚑',color:'#f2f2f2',len:8,wid:3.8,bh:3,speed:46,noCab:1,cross:1,siren:1}
];
const SIRENS=[];
const headMat=new THREE.MeshBasicMaterial({color:0xfff7c0}),tailMat=new THREE.MeshBasicMaterial({color:0xcc2222});
function buildCar(t){
  const g=new THREE.Group(),L=t.len,Wd=t.wid,bh=t.bh;
  const add=(w,h,d,x,y,z,c,cast)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==='string'||typeof c==='number'?mat(c):c);m.position.set(x,y,z);if(cast!==false)m.castShadow=true;g.add(m);return m;};
  const by=0.75+bh/2,top=0.75+bh;
  add(Wd,bh,L,0,by,0,t.color);
  if(!t.noCab){const cl=L*(t.cabL||0.45),cz=t.cabZ===undefined?-L*0.05:t.cabZ;
    add(Wd*0.92,1.1,cl,0,top+0.55,cz,'#1c2430');add(Wd*0.92,0.22,cl,0,top+1.2,cz,t.color);}
  if(t.band)add(Wd+0.06,1.2,L*0.8,0,top-1.1,0,'#1c2430');
  if(t.stripe)add(Wd+0.05,0.8,L*0.4,0,by,-L*0.05,t.stripe);

const over=o=>{const p=pb.position;return p.x+.8>o.lo[0]&&p.x-.8<o.hi[0]&&p.y+2.5>o.lo[1]&&p.y-2.5<o.hi[1]&&p.z+.8>o.lo[2]&&p.z-.8<o.hi[2];};
function movePlayer(dt){
  const p=pb.position,v=pb.velocity;v.y+=GRAV*dt;
  v.x=Math.max(-70,Math.min(70,v.x));v.y=Math.max(-150,Math.min(150,v.y));v.z=Math.max(-70,Math.min(70,v.z));
  const n=Math.min(20,Math.ceil(Math.max(Math.abs(v.x),Math.abs(v.y),Math.abs(v.z))*dt/0.4)||1),h=dt/n;
  for(let s=0;s<n;s++)for(let i=0;i<3;i++){const k=AX[i];if(!v[k])continue;p[k]+=v[k]*h;
    for(const o of COL){if(!over(o))continue;const up=v[k]>0;p[k]=up?o.lo[i]-HALF[i]:o.hi[i]+HALF[i];
      if(i===1){if(!up)lastGround=T;v.y=(!up&&o.tramp)?80:0;}else v[k]=0;}
    if(i===1&&p.y-2.5<0&&Math.abs(p.x)<128&&Math.abs(p.z)<128){p.y=2.5;if(v.y<0)v.y=0;lastGround=T;}}
  for(let pass=0;pass<2;pass++)for(const o of COL){if(!over(o))continue;
    let best=1e9,bi=0,dirn=0;
    for(let i=0;i<3;i++){const k=AX[i],lo=o.lo[i]-HALF[i]-p[k],hi=o.hi[i]+HALF[i]-p[k];if(-lo<best){best=-lo;bi=i;dirn=lo;}if(hi<best){best=hi;bi=i;dirn=hi;}}
    const k=AX[bi];p[k]+=dirn;
    if(bi===1){if(dirn>0){lastGround=T;if(v.y<0)v.y=0;}else if(v.y>0)v.y=0;}}
  const WB=117,YT=280;
  if(p.x>WB){p.x=WB;if(v.x>0)v.x=0;}else if(p.x<-WB){p.x=-WB;if(v.x<0)v.x=0;}
  if(p.z>WB){p.z=WB;if(v.z>0)v.z=0;}else if(p.z<-WB){p.z=-WB;if(v.z<0)v.z=0;}

function driveCar(dt,fw,st){const t=VT[car.type];

    const v=pr.v;
    if(v&&typeof v.x==='number'&&VT[v.t]){if(!ph.car||ph.carT!==v.t){if(ph.car)S.remove(ph.car);ph.car=buildCar(VT[v.t]);S.add(ph.car);ph.carT=v.t;ph.cinit=false;}
      ph.ctgt={x:v.x,z:v.z,h:v.h};ph.drv=!!v.d;if(!ph.cinit){ph.car.position.set(v.x,0,v.z);ph.car.rotation.y=v.h;ph.cinit=true;}}
    else if(ph.car){S.remove(ph.car);ph.car=null;ph.carT=-1;ph.cinit=false;ph.drv=false;}}
  for(const id in peers)if(!seen.has(id)){S.remove(peers[id].rig.g);if(peers[id].car)S.remove(peers[id].car);delete peers[id];}
  if(full){netstat.textContent='Room full ('+MAXP+'/'+MAXP+') — playing solo with bots';netstat.style.display='block';}else if(netstat.textContent.indexOf('Room full')===0)netstat.style.display='none';}
function sendPresence(){if(!room||full)return;const o={name:myName,x:pb.position.x,y:pb.position.y,z:pb.position.z,f:face,j:JOIN,em:emote||'',it:held||'',is:heldS,u:uc};
  if(car.g)o.v={t:car.type,x:car.x,z:car.z,h:car.h,d:car.on?1:0};
  room.presence(o).catch(()=>{});}
async function netStart(){netstat.style.display='block';netstat.textContent='Connecting…';
  try{room=await claude.use('room');}catch(e){room=null;}
  if(!room){netstat.textContent='Multiplayer unavailable here — playing with bots';setTimeout(()=>netstat.style.display='none',4000);return;}
  netOn=true;netstat.style.display='none';
  room.onConnection(c=>{if(!full){netstat.style.display=c?'none':'block';netstat.textContent=c?'':'Reconnecting…';}});
  room.onPeers(()=>refreshPeers());refreshPeers();sendPresence();}

// ===== Input =====
const K={};let yaw=0.6,pitch=0.35,dist=18,drag=false,lx=0,ly=0;
addEventListener('keydown',e=>{K[e.code]=true;if(e.code==='Space')e.preventDefault();
  if(chatOpen)return;if(e.code==='KeyR')respawn();if(e.code==='KeyE')toggleCar();if(e.code==='KeyF')useItem();});
addEventListener('keyup',e=>K[e.code]=false);
R.domElement.addEventListener('contextmenu',e=>e.preventDefault());
R.domElement.addEventListener('mousedown',e=>{if(e.button===2){drag=true;lx=e.clientX;ly=e.clientY;}});
addEventListener('mouseup',e=>{if(e.button===2)drag=false;});
addEventListener('mousemove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*0.006;pitch=Math.max(-0.2,Math.min(1.4,pitch+(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;});
addEventListener('wheel',e=>{dist=Math.max(4,Math.min(60,dist+e.deltaY*0.02));},{passive:true});
addEventListener('keydown',e=>{if(chatOpen){if(e.code==='Enter')closeChat(true);else if(e.code==='Escape')closeChat(false);e.stopPropagation();}
  else if(e.code==='Enter'){e.preventDefault();openChat();}},true);
chatbtn.addEventListener('click',()=>chatOpen?closeChat(true):openChat());
chatbtn.addEventListener('touchstart',e=>{e.preventDefault();chatOpen?closeChat(true):openChat();},{passive:false});
$('csend').addEventListener('click',()=>closeChat(true));
// touch
const joy=$('joy'),knob=$('knob'),jump=$('jump');let jx=0,jy=0,jid=null;
function jset(t){const r=joy.getBoundingClientRect();let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);const m=Math.hypot(dx,dy),max=45;if(m>max){dx*=max/m;dy*=max/m;}knob.style.transform=`translate(${dx}px,${dy}px)`;jx=Math.abs(dx)>10?dx/max:0;jy=Math.abs(dy)>10?dy/max:0;}
const byId=(l,id)=>[...l].find(t=>t.identifier===id);
joy.addEventListener('touchstart',e=>{e.preventDefault();jid=e.changedTouches[0].identifier;jset(e.changedTouches[0]);},{passive:false});
joy.addEventListener('touchmove',e=>{e.preventDefault();const t=byId(e.touches,jid);if(t)jset(t);},{passive:false});
const jend=e=>{if(byId(e.changedTouches,jid)){jid=null;jx=jy=0;knob.style.transform='';}};
joy.addEventListener('touchend',jend);joy.addEventListener('touchcancel',jend);
jump.addEventListener('touchstart',e=>{e.preventDefault();K.Space=true;},{passive:false});
jump.addEventListener('touchend',()=>K.Space=false);jump.addEventListener('touchcancel',()=>K.Space=false);
const tt={},cv=R.domElement;let pd=0;
const d2=()=>{const a=Object.values(tt);return a.length>1?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0;};
cv.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches)tt[t.identifier]={x:t.clientX,y:t.clientY};pd=d2();},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();
  for(const t of e.changedTouches){const o=tt[t.identifier];if(!o)continue;
    if(Object.keys(tt).length===1){yaw-=(t.clientX-o.x)*0.008;pitch=Math.max(-0.2,Math.min(1.4,pitch+(t.clientY-o.y)*0.006));}
    o.x=t.clientX;o.y=t.clientY;}
  if(Object.keys(tt).length>1){const d=d2();dist=Math.max(4,Math.min(60,dist-(d-pd)*0.08));pd=d;}},{passive:false});
const tend=e=>{e.preventDefault();for(const t of e.changedTouches)delete tt[t.identifier];pd=d2();};
cv.addEventListener('touchend',tend,{passive:false});cv.addEventListener('touchcancel',tend,{passive:false});

// ===== Button bar =====
let useBtn,carBtn,timeBtn;
barBtn('🚗 Vehicles',()=>openPanel('veh','Vehicles',[...VT.map((t,i)=>({ico:t.ico,label:t.n,on:car.g&&car.type===i,fn:()=>spawnCar(i)})),{ico:'❌',label:'Remove car',fn:removeCar}],4));
barBtn('🎒 Items',()=>openPanel('items','Items',[...Object.keys(ITEMS).map(id=>({ico:ITEMS[id].ico,label:ITEMS[id].n,on:held===id,fn:()=>equip(id)})),{ico:'🚫',label:'Drop item',fn:()=>equip(null)}],4));
barBtn('🏠 Houses',()=>openPanel('houses','Houses',HOUSES.map(h=>({ico:'🏠',label:'House '+h.n,fn:()=>tp(h.x,h.z)})),4));
barBtn('🗺️ Places',()=>openPanel('places','Places',PLACES.map(p=>({ico:p.ico,label:p.n,fn:()=>tp(p.x,p.z,p.y)})),3));
barBtn('😀 Emotes',()=>openPanel('emotes','Emotes',[...EMOTES.map(e=>({ico:e[1],label:e[2],on:emote===e[0],fn:()=>setEmote(emote===e[0]?null:e[0])})),{ico:'🧍',label:'Stop',fn:()=>setEmote(null)}],3));
timeBtn=barBtn('☀️ Day',()=>{setTime((tm+1)%3);timeBtn.textContent=TIMES[tm].ico+' '+TIMES[tm].n;});
barBtn('🔄 Respawn',respawn);
useBtn=barBtn('✋ Use (F)',useItem);carBtn=barBtn('🚪 Car (E)',toggleCar);
function updBar(){useBtn.style.display=held?'':'none';carBtn.style.display=car.g?'':'none';}
updBar();

// ===== Main loop =====
const clock=new THREE.Clock();let lastSend=0;
function loop(){
try{
  const dt=Math.min(clock.getDelta(),0.05);T+=dt;
  if(K.KeyQ)yaw+=dt*2;if(K.KeyZ)yaw-=dt*2;
  const lock=chatOpen;
  let kx=lock?0:(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0),kz=lock?0:(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0);
  let ix=kx+jx,iz=kz+jy;
  if(car.on){
    const fw=Math.max(-1,Math.min(1,-iz)),st=Math.max(-1,Math.min(1,-ix));driveCar(dt,fw,st);
    if(!drag){const want=car.h+Math.PI;yaw+=(((want-yaw+Math.PI*3)%(Math.PI*2))-Math.PI)*Math.min(1,dt*2.5);}
    animateRig(pRig,dt,0);
  }else{
    const moving=!!(ix||iz),ground=T-lastGround<0.12;let tx=0,tz=0;
    if(moving){if(emote)emote=null;const l=Math.hypot(ix,iz);ix/=l;iz/=l;
      const dx=ix*Math.cos(yaw)+iz*Math.sin(yaw),dz=-ix*Math.sin(yaw)+iz*Math.cos(yaw);tx=dx*16;tz=dz*16;face=Math.atan2(dx,dz);}
    const kk=Math.min(1,dt*(ground?14:5));pb.velocity.x+=(tx-pb.velocity.x)*kk;pb.velocity.z+=(tz-pb.velocity.z)*kk;
    if(K.Space&&ground&&!lock){pb.velocity.y=38;lastGround=-1;if(emote)emote=null;}
    movePlayer(dt);
    pRig.emote=emote;animateRig(pRig,dt,Math.hypot(pb.velocity.x,pb.velocity.z)*(ground?1:0.4));
  }
  pRig.g.position.set(pb.position.x,pb.position.y-2.5,pb.position.z);
  pRig.g.rotation.y+=(((face-pRig.g.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI)*Math.min(1,dt*15);
  for(const b of bots)updateBot(b,dt);
  // other players
  for(const id in peers){const ph=peers[id];if(!ph.tgt)continue;const k=Math.min(1,dt*8),g=ph.rig.g;
    g.position.x+=(ph.tgt.x-g.position.x)*k;g.position.y+=(ph.tgt.y-2.5-g.position.y)*k;g.position.z+=(ph.tgt.z-g.position.z)*k;
    const dr=((ph.tgt.f-g.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;g.rotation.y+=dr*Math.min(1,dt*10);
    const sp=dt>0?Math.hypot(ph.tgt.x-ph.lx,ph.tgt.z-ph.lz)/Math.max(dt,0.016):0;ph.lx=ph.tgt.x;ph.lz=ph.tgt.z;ph.spd+=(Math.min(sp,40)-ph.spd)*Math.min(1,dt*6);
    animateRig(ph.rig,dt,ph.spd);g.visible=!ph.drv;
    if(ph.car&&ph.ctgt){const c=ph.car;c.position.x+=(ph.ctgt.x-c.position.x)*k;c.position.z+=(ph.ctgt.z-c.position.z)*k;const d2r=((ph.ctgt.h-c.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;c.rotation.y+=d2r*Math.min(1,dt*10);}}
  // sirens
  const sb=Math.floor(T*4)%2===0;for(const s of SIRENS){s.a.visible=sb;s.b.visible=!sb;}
  // camera
  const t=car.on?new THREE.Vector3(car.x,3.5,car.z):pRig.g.position.clone();if(!car.on)t.y+=3.5;
  C.position.set(t.x+Math.sin(yaw)*Math.cos(pitch)*dist,t.y+Math.sin(pitch)*dist,t.z+Math.cos(yaw)*Math.cos(pitch)*dist);
  C.lookAt(t);sun.target.position.copy(pRig.g.position);sun.position.set(pRig.g.position.x+40,80,pRig.g.position.z+30);
  if(pb.position.y<-60)respawn();
  if(netOn&&T-lastSend>0.12){lastSend=T;sendPresence();}
  R.render(S,C);
}catch(err){console.error('Brookhaven frame error:',err);}
requestAnimationFrame(loop);
}
const fit=()=>{R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();};
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,150));
for(let i=0;i<BOTN;i++)spawnBot(i);
respawn();setTime(0);
loop();
</script>
